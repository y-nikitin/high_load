# Historical project name preserves the database volume from Labs 1-2.
name: high-load-lab1
services:
  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lab1-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: high-load-order-service:lab4
    deploy:
      replicas: 2
    environment:
      DB_URL: jdbc:postgresql://db:5432/orders
      DB_USERNAME: orders
      DB_PASSWORD: ${DB_PASSWORD:-lab1-local-password}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      # INSTANCE_ID falls back to each container's unique HOSTNAME.
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 20
    restart: unless-stopped

  lb:
    image: haproxy:3.0-alpine
    environment:
      LB_ALGORITHM: ${LB_ALGORITHM:-roundrobin}
    volumes:
      - ./infra/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  load:
    image: grafana/k6:0.57.0
    profiles: [tools]
    entrypoint: ["k6", "run", "/scripts/scaling.js"]
    environment:
      BASE_URL: http://lb:8080
      VUS: ${VUS:-20}
      DURATION: ${DURATION:-30s}
      RUN_NAME: ${RUN_NAME:-manual}
      SLOW_INSTANCE: ${SLOW_INSTANCE:-}
      INSTANCE_IDS: ${INSTANCE_IDS:-}
      REQUIRE_NO_ERRORS: ${REQUIRE_NO_ERRORS:-false}
    volumes:
      - ./load-tests:/scripts:ro
      - ./results:/results
    networks: [backend]

networks:
  backend:
volumes:
  postgres-data:
