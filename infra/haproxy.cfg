global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 30s
    timeout server 15s
    timeout check 2s
    retries 2
    # Retry connection establishment failures only; do not replay a sent POST.
    retry-on conn-failure
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s
    hold nx 1s
    hold timeout 1s
    hold refused 1s

frontend public_http
    bind :8080
    default_backend order_api

backend order_api
    balance "${LB_ALGORITHM}"
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # Docker DNS discovers replicas; two failed/successful probes remove/readmit a node.
    server-template node 1-10 app:8080 check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none
