app:
  instance-id: ${INSTANCE_ID:${HOSTNAME:}}
  cache:
    enabled: ${CACHE_ENABLED:false}
    ttl-seconds: ${CACHE_TTL_SECONDS:30}
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 200ms
      timeout: 200ms
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:lab1-local-password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      connection-init-sql: "SET lock_timeout = '3s'"
      data-source-properties:
        ApplicationName: ${app.instance-id:order-service}
  jdbc:
    template:
      query-timeout: 10s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
